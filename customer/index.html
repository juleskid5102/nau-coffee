<!DOCTYPE html>
<html lang="vi" class="dark" style="background-color: #14110e; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Nâu Coffee — Specialty Coffee Experience</title>
    <meta name="description" content="Nâu Coffee — Trải nghiệm cà phê thủ công đặc biệt. Khám phá menu đa dạng, không gian ấm cúng và đặt món trực tuyến." />
    <meta name="theme-color" content="#14110e" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nâu Coffee — Specialty Coffee Experience" />
    <meta property="og:description" content="Trải nghiệm cà phê thủ công đặc biệt. Khám phá menu đa dạng, không gian ấm cúng." />
    <meta property="og:locale" content="vi_VN" />

    <!-- Google Fonts — loaded from HTML to prevent Tailwind stripping -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <!-- Preload heading font — prevent FOUT flash -->
    <link rel="preload" href="/fonts/stigma.otf" as="font" type="font/otf" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body style="background-color: #14110e; color: #e8e0d4; margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
